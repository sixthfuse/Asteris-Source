<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Asteris Academic Advisor</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="/app" aria-label="Asteris home">
          <span class="brand-mark" aria-hidden="true">A</span>
          <span><strong>Asteris</strong><small>Academic Advisor</small></span>
        </a>
        <div class="verified-pill"><span></span> Verified academic data</div>
      </header>
      <main class="workspace">
        <section class="chat-panel" aria-label="Advisor conversation">
          <div id="messages" class="messages" aria-live="polite">
            <article class="message advisor-message">
              <div class="avatar" aria-hidden="true">A</div>
              <div class="bubble">
                <p>Hi, I’m Asteris. Ask me about a course, program, eligibility, or academic planning.</p>
                <div class="suggestions" aria-label="Suggested questions">
                  <button type="button">Tell me about Hydraulics</button>
                  <button type="button">Tell me about the Civil Engineering Diploma program</button>
                  <button type="button">What can I take next?</button>
                </div>
              </div>
            </article>
          </div>
          <form id="chat-form" class="composer">
            <label class="sr-only" for="question">Ask Asteris</label>
            <textarea id="question" rows="2" placeholder="Ask about courses, programs, eligibility, or progress…" required></textarea>
            <button id="send" type="submit" aria-label="Send question"><span>Send</span><span aria-hidden="true">→</span></button>
          </form>
          <p id="status" class="status">Answers are calculated from verified Asteris data.</p>
          <button id="clear" class="secondary-button" type="button">Start a new conversation</button>
        </section>
      </main>
    </div>
  </body>
</html>
